<!doctype html><meta charset="utf-8"><title>grain sheet</title>
<body style="margin:0;background:#111"><canvas id="c"></canvas>
<script>
const RUNGS = [
  ['00', '0° — today', 'separation 6.43° · the road is made of the table'],
  ['35', '35° — shipped', 'separation 31.93° · a board laid across it'],
  ['55', '55°', 'separation 59.15°'],
  ['90', '90°', 'separation 89.39° · square to the table’s own joints'],
];
const IW = 640, IH = 560, PAD = 18, LAB = 62;
const CW = PAD + (IW + PAD) * 2, CH = PAD + (IH + LAB + PAD) * 2;
const c = document.getElementById('c');
c.width = CW; c.height = CH;
const g = c.getContext('2d');
g.fillStyle = '#0d0d0f'; g.fillRect(0, 0, CW, CH);
(async () => {
  for (let i = 0; i < RUNGS.length; i++) {
    const [id, title, note] = RUNGS[i];
    const img = new Image();
    img.src = '/shots/grainrung-' + id + '.png';
    await img.decode();
    const x = PAD + (i % 2) * (IW + PAD);
    const y = PAD + Math.floor(i / 2) * (IH + LAB + PAD);
    g.drawImage(img, x, y, IW, IH);
    g.strokeStyle = id === '35' ? '#e8b552' : '#333';
    g.lineWidth = id === '35' ? 3 : 1;
    g.strokeRect(x + 0.5, y + 0.5, IW - 1, IH - 1);
    g.fillStyle = id === '35' ? '#e8b552' : '#eaeaea';
    g.font = '600 24px ui-monospace, Menlo, monospace';
    g.fillText(title, x, y + IH + 28);
    g.fillStyle = '#8d8d95';
    g.font = '16px ui-monospace, Menlo, monospace';
    g.fillText(note, x, y + IH + 50);
  }
  const url = c.toDataURL('image/png');
  await fetch('/__shot?name=grain-sheet', { method: 'POST', body: url });
  document.title = 'done';
})();
</script>
