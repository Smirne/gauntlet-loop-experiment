<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MICRO GAUNTLET</title>
<meta name="description" content="A die-cast racer on a kitchen table. Eight cars, one circuit, three laps." />
<meta name="theme-color" content="#16120E" />
<!-- Inline SVG favicon: a chequered flag in the game's own accent. Inline
     because the whole point of this build is that it ships as static files with
     no asset pipeline and no external requests — a favicon is not the place to
     start making some. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316120E'/%3E%3Cg fill='%23F1E9DD'%3E%3Crect x='6' y='6' width='5' height='5'/%3E%3Crect x='16' y='6' width='5' height='5'/%3E%3Crect x='11' y='11' width='5' height='5'/%3E%3Crect x='21' y='11' width='5' height='5'/%3E%3Crect x='6' y='16' width='5' height='5'/%3E%3Crect x='16' y='16' width='5' height='5'/%3E%3C/g%3E%3Crect x='4' y='4' width='2' height='24' fill='%23D14526'/%3E%3C/svg%3E" />
<meta property="og:title" content="MICRO GAUNTLET" />
<meta property="og:description" content="A die-cast racer on a kitchen table. Eight cars, one circuit, three laps." />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="./src/ui/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>
    <div id="ui-root"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-logo">MICRO<span>GAUNTLET</span></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-msg">warming up the tarmac&hellip;</div>
      </div>
    </div>
    <div id="fatal" hidden><pre></pre></div>
  </div>
  <script type="module">
    window.addEventListener('error', (e) => window.__mgFatal?.(e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => window.__mgFatal?.(e.reason));
    window.__mgFatal = (err) => {
      const el = document.getElementById('fatal');
      if (!el) return;
      el.hidden = false;
      el.querySelector('pre').textContent = (err && (err.stack || err.message)) || String(err);
      console.error('[MICRO GAUNTLET] fatal:', err);
    };
    import('./src/main.js').catch((err) => window.__mgFatal(err));
  </script>
</body>
</html>
